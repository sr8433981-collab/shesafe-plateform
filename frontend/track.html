<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SheSafe — Live Emergency Guardian Tracking</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    :root {
      --primary: #e11d48;
      --emerald: #059669;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border-radius: 10px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: var(--primary);
      font-size: 1.2rem;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    #mapContainer {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .guardian-card {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      right: 1.25rem;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.15rem 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      z-index: 1000;
    }

    .user-info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.65rem;
    }
    .user-name-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }
    .user-address {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      line-height: 1.35;
    }

    .telemetry-row {
      display: flex;
      gap: 1.25rem;
      padding: 0.65rem 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 0.85rem;
      font-size: 0.8rem;
    }
    .tel-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tel-item strong {
      color: #1e293b;
      font-size: 0.88rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.65rem;
    }
    .btn {
      flex: 1;
      padding: 0.65rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn-call {
      background: #10b981;
      color: white;
    }
    .btn-call-112 {
      background: #dc2626;
      color: white;
    }
    .btn-maps {
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand-icon">🛡️</div>
      <div>
        <div class="brand-title">SheSafe Guardian</div>
        <div class="brand-sub">Real-Time Emergency Location Tracking</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="pulse-dot"></div>
      <span id="headerStatus">LIVE STREAM ACTIVE</span>
    </div>
  </header>

  <div id="mapContainer"></div>

  <!-- Guardian Status Floating Card -->
  <div class="guardian-card">
    <div class="user-info-row">
      <div>
        <div class="user-name-title" id="trackUserName">Sweta Sharma</div>
        <div class="user-address" id="trackAddress">Fetching live street address...</div>
      </div>
      <div id="batteryIndicator" style="font-size: 0.78rem; font-weight: 700; color: #059669; background: #d1fae5; padding: 0.2rem 0.5rem; border-radius: 999px;">
        🔋 92%
      </div>
    </div>

    <div class="telemetry-row">
      <div class="tel-item">
        <span>GPS Coordinates</span>
        <strong id="trackCoords">28.6328° N, 77.2197° E</strong>
      </div>
      <div class="tel-item">
        <span>Accuracy</span>
        <strong id="trackAccuracy">±4 meters</strong>
      </div>
      <div class="tel-item">
        <span>Last Ping</span>
        <strong id="trackLastSeen">Just now</strong>
      </div>
    </div>

    <div class="action-buttons">
      <a href="tel:[REDACTED-PII]" class="btn btn-call" id="btnCallUser">
        📞 Call Sweta
      </a>
      <a href="tel:112" class="btn btn-call-112">
        🚨 Call 112
      </a>
      <a href="#" id="btnOpenGoogleMaps" target="_blank" class="btn btn-maps">
        🗺️ Navigate
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user') || 'usr_sweta_01';

    let map = null;
    let userMarker = null;
    let accuracyCircle = null;
    let routeTrail = [];
    let trailPolyline = null;
    let lastPingTime = Date.now();

    function initMap(lat, lng) {
      map = L.map('mapContainer').setView([lat, lng], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const liveIcon = L.divIcon({
        className: 'guardian-live-marker',
        html: `
          <div style="position: relative; width: 32px; height: 32px;">
            <div style="position: absolute; width: 32px; height: 32px; border-radius: 50%; background: rgba(225, 29, 72, 0.35); animation: pulse 1.5s infinite;"></div>
            <div style="position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%; background: #e11d48; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.3);"></div>
          </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      userMarker = L.marker([lat, lng], { icon: liveIcon }).addTo(map);
      accuracyCircle = L.circle([lat, lng], {
        radius: 15,
        color: '#e11d48',
        fillColor: '#fda4af',
        fillOpacity: 0.2,
        weight: 1
      }).addTo(map);

      trailPolyline = L.polyline([[lat, lng]], { color: '#e11d48', weight: 4, dashArray: '5, 8' }).addTo(map);
    }

    async function fetchLiveLocation() {
      try {
        const res = await fetch(`/api/location/live/${userId}`);
        const data = await res.json();
        if (data && data.success && data.location) {
          updateUI(data.location);
          return;
        }
      } catch (err) {
        console.log('Fetching from local fallback store');
      }

      // Local fallback from storage if server not connected
      const stored = localStorage.getItem('shesafe_live_location');
      if (stored) {
        try {
          const loc = JSON.parse(stored);
          updateUI(loc);
          return;
        } catch (e) {}
      }

      // Default seed fallback
      updateUI({
        userName: 'Sweta Sharma',
        lat: 28.6328,
        lng: 77.2197,
        accuracy: 5,
        address: 'Connaught Place, New Delhi',
        battery: 92,
        timestamp: new Date().toISOString()
      });
    }

    function updateUI(loc) {
      const lat = loc.lat;
      const lng = loc.lng;

      if (!map) {
        initMap(lat, lng);
      } else {
        userMarker.setLatLng([lat, lng]);
        accuracyCircle.setLatLng([lat, lng]);
        accuracyCircle.setRadius(loc.accuracy || 15);
        map.panTo([lat, lng]);

        routeTrail.push([lat, lng]);
        trailPolyline.setLatLngs(routeTrail);
      }

      document.getElementById('trackUserName').innerText = loc.userName || 'Sweta Sharma';
      document.getElementById('trackAddress').innerText = loc.address || 'Live GPS Coordinates';
      document.getElementById('trackCoords').innerText = `${lat.toFixed(5)}° N, ${lng.toFixed(5)}° E`;
      document.getElementById('trackAccuracy').innerText = `±${Math.round(loc.accuracy || 5)}m`;

      if (loc.battery) {
        document.getElementById('batteryIndicator').innerText = `🔋 ${loc.battery}%`;
      }

      document.getElementById('btnOpenGoogleMaps').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
      lastPingTime = Date.now();
    }

    // Ticker for "Last Ping" seconds
    setInterval(() => {
      const elapsedSec = Math.floor((Date.now() - lastPingTime) / 1000);
      document.getElementById('trackLastSeen').innerText = elapsedSec <= 1 ? 'Just now' : `${elapsedSec}s ago`;
    }, 1000);

    // Poll live location every 3 seconds
    fetchLiveLocation();
    setInterval(fetchLiveLocation, 3000);
  </script>
</body>
</html>
